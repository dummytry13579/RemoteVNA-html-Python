<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNA SCPI Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0052a3;
        }
        pre {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 4px;
            min-height: 50px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h2>VNA SCPI Controller</h2>

    <div class="form-group">
        <label for="address">Full VISA Resource Address:</label>
        <input type="text" id="address" placeholder="e.g. TCPIP0::192.168.1.100::hislip0::INSTR">
    </div>

    <div class="form-group">
        <label for="command">SCPI Command:</label>
        <input type="text" id="command" value="*IDN?">
    </div>

    <button onclick="sendSCPI()">Send Command</button>

    <h3>Response:</h3>
    <pre id="output">Output will appear here...</pre>

    <script>
        async function sendSCPI() {
            const address = document.getElementById('address').value;
            const command = document.getElementById('command').value;
            const output = document.getElementById('output');

            output.textContent = "Sending...";

            try {
                const res = await fetch('/send_scpi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address, command })
                });

                const data = await res.json();
                output.textContent = data.response;
            } catch (err) {
                output.textContent = "Request failed: " + err.message;
            }
        }
    </script>
</body>
</html>
